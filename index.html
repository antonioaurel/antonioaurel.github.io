<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Antonio O — QA, Data Quality & AI</title>
  <meta name="description" content="Antonio O — Senior QA, Data Quality Engineer and AI researcher. Selected work, case studies and experience.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var s = localStorage.getItem("ao_theme");
        if (s !== "light" && s !== "dark") {
          s = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.setAttribute("data-theme", s);
      } catch (e) {}
    })();
  </script>
  <style>
    :root[data-theme="dark"] {
      --bg:#100f0d; --surface:#161512; --card:#1b1a17;
      --border:rgba(255,255,255,0.09); --hair:rgba(255,255,255,0.06);
      --text:#ece9e3; --muted:#9a958c; --faint:#6a655d;
      --accent:#e8b667; --accent-strong:#a07c3a;
      --photo1:#26241f; --photo2:#201e1a; --cta-fg:#100f0d;
    }
    :root[data-theme="light"] {
      --bg:#ffffff; --surface:#f6f6f6; --card:#ffffff;
      --border:rgba(0,0,0,0.12); --hair:rgba(0,0,0,0.08);
      --text:#141414; --muted:#5a5a5a; --faint:#9a9a9a;
      --accent:#161616; --accent-strong:#000000;
      --photo1:#ececec; --photo2:#e4e4e4; --cta-fg:#ffffff;
    }

    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body {
      margin:0; background:var(--bg); color:var(--text);
      font-family:'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height:1.55; -webkit-font-smoothing:antialiased; overflow-x:hidden;
      transition:background .4s ease, color .4s ease;
    }
    ::selection { background:var(--accent); color:var(--cta-fg); }
    img { max-width:100%; }

    .mono { font-family:'JetBrains Mono', ui-monospace, monospace; }
    .serif { font-family:'Newsreader', Georgia, serif; font-weight:400; }

    @keyframes rise   { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px);  } to { opacity:1; transform:none; } }

    /* ---------- nav ---------- */
    .nav {
      position:sticky; top:0; z-index:60;
      backdrop-filter:blur(16px);
      background:color-mix(in srgb, var(--bg) 78%, transparent);
      border-bottom:1px solid var(--hair);
    }
    .nav-inner {
      max-width:1160px; margin:0 auto; padding:15px 34px;
      display:flex; align-items:center; justify-content:space-between; gap:20px;
    }
    .brand {
      display:flex; align-items:center; gap:11px; text-decoration:none;
      color:var(--text); font-weight:600; font-size:15px; letter-spacing:-.01em;
    }
    .brand .dot { width:9px; height:9px; border-radius:50%; background:var(--accent); }
    .brand .period { color:var(--accent); }
    .nav-right { display:flex; align-items:center; gap:30px; }
    .nav-links { display:flex; gap:26px; font-size:13.5px; }
    .nav-links a { color:var(--muted); text-decoration:none; transition:color .12s; }
    .nav-links a:hover { color:var(--text); }
    .theme-btn {
      width:34px; height:34px; border-radius:50%; border:1px solid var(--border);
      background:transparent; color:var(--text); cursor:pointer; font-size:14px;
      display:flex; align-items:center; justify-content:center;
      transition:border-color .2s;
    }
    .theme-btn:hover { border-color:var(--accent); }
    .cta {
      background:var(--accent); color:var(--cta-fg); font-size:13.5px; font-weight:500;
      padding:9px 18px; border-radius:8px; text-decoration:none;
      transition:background .12s;
    }
    .cta:hover { background:var(--accent-strong); }

    /* ---------- section shell ---------- */
    .sec { max-width:1160px; margin:0 auto; padding:80px 34px; scroll-margin-top:80px; }
    .sec + .sec, .sec.ruled { border-top:1px solid var(--hair); }
    .eyebrow {
      font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:.18em;
      color:var(--accent); margin-bottom:20px;
    }
    .eyebrow.gap { margin-bottom:40px; }
    .label {
      font-family:'JetBrains Mono', monospace; font-size:10.5px; letter-spacing:.14em;
      color:var(--faint); margin-bottom:8px;
    }
    .pill {
      font-family:'JetBrains Mono', monospace; font-size:11.5px; padding:5px 11px;
      border:1px solid var(--border); border-radius:100px; color:var(--muted);
    }
    .pills { display:flex; flex-wrap:wrap; gap:7px; }

    /* ---------- hero ---------- */
    .hero { padding-top:96px; }
    .hero-grid { display:grid; grid-template-columns:1.55fr 1fr; gap:56px; align-items:center; }
    .hero-copy { animation:rise .8s cubic-bezier(.16,1,.3,1) both; }
    .hero-eyebrow { font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.18em; color:var(--accent); margin-bottom:26px; }
    .hero p { font-size:20px; line-height:1.6; color:var(--muted); margin:0 0 36px; max-width:50ch; scroll-margin-top:90px; }
    .hero-ctas { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:40px; }
    .btn-fill {
      background:var(--accent); color:var(--cta-fg); font-size:14.5px; font-weight:500;
      padding:13px 24px; border-radius:9px; text-decoration:none; transition:background .12s;
    }
    .btn-fill:hover { background:var(--accent-strong); }
    .btn-outline {
      border:1px solid var(--border); color:var(--text); font-size:14.5px;
      padding:13px 24px; border-radius:9px; text-decoration:none; transition:border-color .12s;
    }
    .btn-outline:hover { border-color:var(--accent); }
    .hero-social { display:flex; flex-wrap:wrap; gap:22px; font-family:'JetBrains Mono',monospace; font-size:12.5px; }
    .hero-social a { color:var(--muted); text-decoration:none; transition:color .12s; }
    .hero-social a:hover { color:var(--accent); }
    .hero-photo { animation:rise .9s cubic-bezier(.16,1,.3,1) .1s both; }
    .hero-photo img {
      width:70%; aspect-ratio:4/5; object-fit:cover; object-position:50% 18%;
      border-radius:16px; border:1px solid var(--border); display:block; margin:0 auto;
    }

    /* ---------- experience ---------- */
    .exp-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:20px; }
    .exp-card {
      position:relative; min-height:158px; border:1px solid var(--border); border-radius:16px;
      background:var(--card); cursor:pointer; display:flex; flex-direction:column;
      align-items:center; justify-content:center; text-align:center; padding:26px 22px;
      transition:border-color .2s; font:inherit; color:inherit; width:100%;
    }
    .exp-card:hover { border-color:var(--accent-strong); }
    .exp-card:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
    .exp-card .co { font-family:'Newsreader',serif; font-size:25px; line-height:1.12; color:var(--text); letter-spacing:-.01em; }
    .exp-card .per { font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.12em; color:var(--faint); margin-top:12px; }
    .exp-card[aria-expanded="true"]::after {
      content:""; position:absolute; inset:0; border:1.5px solid var(--accent);
      border-radius:16px; pointer-events:none;
    }
    .exp-panel {
      grid-column:1/-1; border:1px solid var(--border); border-radius:18px;
      background:var(--card); padding:34px 36px;
      animation:fadeIn .32s cubic-bezier(.16,1,.3,1) both;
    }
    .exp-panel-head { display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px; align-items:baseline; }
    .exp-panel-head h3 { font-family:'Newsreader',serif; font-weight:400; font-size:28px; margin:0; letter-spacing:-.01em; }
    .exp-panel-head .per { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--accent); }
    .exp-role { font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.06em; color:var(--muted); margin-top:6px; }
    .exp-panel p.sum { font-size:15.5px; color:var(--text); opacity:.82; margin:20px 0 26px; max-width:82ch; }
    .exp-resp { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:14px 34px; }
    .exp-resp div { display:flex; gap:10px; font-size:14px; color:var(--muted); }
    .exp-resp .bullet { color:var(--accent); }
    .exp-tech { margin-top:26px; padding-top:22px; border-top:1px solid var(--hair); }

    /* ---------- work ---------- */
    .work-grid { display:grid; grid-template-columns:1fr 1fr; gap:22px; }
    .work-card {
      border:1px solid var(--border); border-radius:16px; background:var(--card);
      overflow:hidden; display:flex; flex-direction:column; transition:border-color .12s;
    }
    .work-card:hover { border-color:var(--accent-strong); }
    .work-card img { width:100%; aspect-ratio:16/9; object-fit:cover; border-bottom:1px solid var(--hair); display:block; }
    .shot {
      aspect-ratio:16/9; border-bottom:1px solid var(--hair); display:flex; align-items:flex-end; padding:14px;
      background:repeating-linear-gradient(135deg, var(--photo1), var(--photo1) 9px, var(--photo2) 9px, var(--photo2) 18px);
    }
    .shot span { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--faint); }
    .work-body { padding:24px; flex:1; display:flex; flex-direction:column; }
    .work-body h3 { font-size:19px; font-weight:600; margin:0 0 10px; }
    .work-body p { font-size:14.5px; color:var(--muted); margin:0 0 14px; }
    .problem { font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--accent); margin-bottom:16px; }
    .work-links { display:flex; flex-wrap:wrap; gap:18px; margin-top:auto; font-family:'JetBrains Mono',monospace; font-size:12.5px; }
    .work-links a { color:var(--muted); text-decoration:none; transition:color .12s; }
    .work-links a:hover { color:var(--accent); }
    .tags-sm { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px; }
    .tags-sm .pill { font-size:11px; padding:4px 10px; }

    /* ---------- cases ---------- */
    .cases { display:flex; flex-direction:column; gap:22px; }
    .case {
      border:1px solid var(--border); border-radius:18px; background:var(--card); padding:34px;
    }
    .case > img {
      width:100%; max-height:340px; object-fit:cover; border-radius:12px;
      border:1px solid var(--hair); display:block; margin-bottom:26px;
    }
    .case-head { display:flex; align-items:baseline; gap:16px; margin-bottom:24px; }
    .case-head .num { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--accent); }
    .case-head h3 { font-family:'Newsreader',serif; font-weight:400; font-size:26px; margin:0; }
    .case-cols { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:24px; }
    .case-cols p { font-size:14px; color:var(--muted); margin:0; }
    .case-foot {
      display:flex; flex-wrap:wrap; justify-content:space-between; gap:16px; align-items:center;
      margin-top:24px; padding-top:22px; border-top:1px solid var(--hair);
    }
    .case-foot a { font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--accent); text-decoration:none; }
    .case-foot a:hover { text-decoration:underline; }

    /* ---------- research / education ---------- */
    .two-col { display:grid; grid-template-columns:1fr 1.3fr; gap:56px; align-items:start; }
    .two-col.wide-left { grid-template-columns:1.3fr 1fr; }
    .two-col h2 { font-family:'Newsreader',serif; font-weight:400; font-size:30px; margin:0 0 14px; letter-spacing:-.02em; }
    .two-col > div > p { font-size:16px; color:var(--muted); margin:0 0 24px; }
    .pub { padding:20px 0; border-bottom:1px solid var(--hair); display:grid; grid-template-columns:70px 1fr auto; gap:18px; align-items:baseline; }
    .pub .venue { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--accent); }
    .pub .title { font-size:16px; color:var(--text); margin-bottom:4px; }
    .pub .authors { font-size:13px; color:var(--faint); }
    .pub a { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--accent); text-decoration:none; }
    .ongoing { margin-top:18px; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--faint); }
    .edu { display:grid; grid-template-columns:110px 1fr; gap:22px; padding:22px 0; border-bottom:1px solid var(--hair); }
    .edu .per { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--accent); }
    .edu .degree { font-size:17px; font-weight:600; margin-bottom:4px; }
    .edu .school { font-size:14px; color:var(--muted); }
    .edu .note { font-size:13px; color:var(--faint); margin-top:4px; }
    .certs { display:flex; flex-direction:column; gap:12px; }
    .certs div { display:flex; gap:10px; font-size:14px; color:var(--muted); }
    .certs .check { color:var(--accent); font-family:'JetBrains Mono',monospace; font-size:12px; }

    /* ---------- skills ---------- */
    .skills-rows { display:flex; flex-direction:column; }
    .skill-row {
      display:grid; grid-template-columns:210px 1fr; gap:28px;
      padding:20px 0; border-top:1px solid var(--hair); align-items:baseline;
    }
    .skill-row:last-child { border-bottom:1px solid var(--hair); }
    .skill-row .group {
      font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.12em;
      color:var(--accent);
    }
    .skill-items { display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 9px; font-size:14px; color:var(--muted); }
    .skill-items .sep { color:var(--faint); opacity:.7; }

    /* ---------- beyond ---------- */
    .beyond-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }
    .beyond-card {
      border:1px solid var(--border); border-radius:16px; background:var(--card);
      overflow:hidden; display:flex; flex-direction:column; transition:border-color .12s;
    }
    .beyond-card:hover { border-color:var(--accent-strong); }
    .beyond-card img { width:100%; aspect-ratio:3/4; object-fit:cover; display:block; border-bottom:1px solid var(--hair); }
    .beyond-body { padding:26px; flex:1; display:flex; flex-direction:column; }
    .beyond-body h3 { font-size:18px; font-weight:600; margin:0 0 10px; }
    .beyond-body p { font-size:14px; color:var(--muted); margin:0; }
    .glyph {
      width:38px; height:38px; border-radius:10px;
      background:color-mix(in srgb, var(--accent) 18%, transparent);
      display:flex; align-items:center; justify-content:center;
      font-family:'JetBrains Mono',monospace; font-size:14px; color:var(--accent); margin-bottom:20px;
    }
    .beyond-body a { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--accent); text-decoration:none; margin-top:16px; }
    .beyond-body a:hover { text-decoration:underline; }

    /* ---------- contact ---------- */
    .contact { text-align:center; padding-top:110px; padding-bottom:110px; }
    .contact p { font-size:18px; color:var(--muted); max-width:52ch; margin:0 auto 40px; }
    .contact-btns { display:flex; flex-wrap:wrap; gap:14px; justify-content:center; }
    .contact-btns a { border:1px solid var(--border); color:var(--text); font-size:15px; padding:15px 30px; border-radius:10px; text-decoration:none; transition:border-color .12s; }
    .contact-btns a:hover { border-color:var(--accent); }

    footer {
      max-width:1160px; margin:0 auto; padding:34px; border-top:1px solid var(--hair);
      display:flex; flex-wrap:wrap; justify-content:space-between; gap:16px;
      font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--faint);
    }

    /* ---------- reveal ---------- */
    @supports (animation-timeline: view()) {
      .reveal { animation:rise .5s cubic-bezier(.16,1,.3,1) both; animation-timeline:view(); animation-range:entry 0% entry 40%; }
    }

    /* ---------- responsive ---------- */
    @media (max-width:900px) {
      /* every multi-column grid collapses to one column here */
      .hero-grid, .two-col, .two-col.wide-left { grid-template-columns:1fr; gap:36px; }
      .hero-photo img { width:min(58%, 260px); }
      .work-grid { grid-template-columns:1fr; }
      .beyond-grid { grid-template-columns:repeat(2,1fr); }
      .skill-row { grid-template-columns:1fr; gap:8px; }
      .pub, .edu { grid-template-columns:1fr; gap:6px; }
      .nav-links { display:none; }

      /* ...and single-column content is centred. Text centres by inheritance
         from .sec; every flex row and fixed-width box needs saying explicitly. */
      .sec { text-align:center; }
      .hero p,
      .exp-panel p.sum,
      .two-col > div > p { margin-left:auto; margin-right:auto; }
      .hero-ctas,
      .hero-social,
      .pills,
      .tags-sm,
      .work-links,
      .skill-items,
      .exp-panel-head,
      .exp-resp div,
      .case-head,
      .case-foot { justify-content:center; }
      .glyph { margin-left:auto; margin-right:auto; }
      .beyond-body,
      .certs div { align-items:center; }
      footer { justify-content:center; text-align:center; }
    }
    @media (max-width:560px) {
      .sec { padding:56px 20px; }
      .hero { padding-top:64px; }
      .nav-inner { padding:13px 20px; }
      .beyond-grid { grid-template-columns:1fr; }
      .case { padding:24px; }
      .exp-panel { padding:24px; }
      .hero p { font-size:17px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation:none !important; transition:none !important; scroll-behavior:auto !important; }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <div class="nav-inner">
      <a href="#top" class="brand"><span class="dot"></span><span id="brand-name">Antonio O</span><span class="period">.</span></a>
      <div class="nav-right">
        <div class="nav-links" id="nav-links"></div>
        <button type="button" class="theme-btn" id="theme-btn" aria-label="Toggle theme">☾</button>
        <a href="#contact" class="cta">Contact</a>
      </div>
    </div>
  </nav>

  <main id="app">
    <p class="sec" id="boot" style="color:var(--muted)">Loading…</p>
  </main>

  <footer>
    <span id="foot-left"></span>
    <span id="foot-right">Built with a small portfolio.json</span>
  </footer>

  <script>
    var root = document.documentElement;
    function read(k)     { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

    var theme = root.getAttribute("data-theme") === "light" ? "light" : "dark";
    var themeBtn = document.getElementById("theme-btn");
    function paintTheme() { themeBtn.textContent = theme === "dark" ? "☾" : "☀"; }
    themeBtn.onclick = function () {
      theme = theme === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", theme);
      store("ao_theme", theme);
      paintTheme();
    };
    paintTheme();

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
        return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c];
      });
    }
    function pills(list, cls) {
      return '<div class="pills">' + (list || []).map(function (t) {
        return '<span class="pill ' + (cls || "") + '">' + esc(t) + "</span>";
      }).join("") + "</div>";
    }
    function extLink(url, label, cls) {
      return '<a class="' + (cls || "") + '" href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(label) + " ↗</a>";
    }

    var data = null;
    var openExp = null;

    fetch("portfolio.json", { cache: "no-cache" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) {
        data = d;
        render();
      })
      .catch(function (e) {
        document.getElementById("boot").textContent =
          "Could not load portfolio.json (" + e.message + "). Run a local server.";
      });

    /* ---------- sections ---------- */

    function heroHTML(s) {
      var social = (s.social || []).map(function (l) { return extLink(l.url, l.label); }).join("");
      var cv = s.cv ? '<a class="btn-outline" href="' + esc(s.cv) + '" target="_blank" rel="noopener" download>Download CV</a>' : "";
      return '<section class="sec hero" id="top"><div class="hero-grid">' +
        '<div class="hero-copy">' +
          '<div class="hero-eyebrow">' + esc(s.eyebrow) + "</div>" +
          '<p id="about">' + esc(s.about) + "</p>" +
          '<div class="hero-ctas"><a class="btn-fill" href="#work">View selected work</a>' + cv + "</div>" +
          '<div class="hero-social">' + social + "</div>" +
        "</div>" +
        '<div class="hero-photo"><img src="' + esc(s.portrait) + '" alt="Antonio O" loading="lazy"></div>' +
      "</div></section>";
    }

    function expHTML(list) {
      if (!list || !list.length) return "";
      var cards = list.map(function (e) {
        var isOpen = openExp === e.id;
        var card = '<button type="button" class="exp-card" data-exp="' + esc(e.id) + '" aria-expanded="' + isOpen + '">' +
            '<span class="co">' + esc(e.company) + "</span>" +
            '<span class="per">' + esc(e.period) + "</span>" +
          "</button>";
        if (!isOpen) return card;
        var resp = (e.responsibilities || []).map(function (r) {
          return '<div><span class="bullet">•</span><span>' + esc(r) + "</span></div>";
        }).join("");
        var panel = '<div class="exp-panel">' +
            '<div class="exp-panel-head"><h3>' + esc(e.company) + "</h3>" +
              '<span class="per">' + esc(e.period) + "</span></div>" +
            '<div class="exp-role">' + esc(e.role) + "</div>" +
            '<p class="sum">' + esc(e.summary) + "</p>" +
            '<div class="exp-resp">' + resp + "</div>" +
            '<div class="exp-tech"><div class="label">TECHNOLOGIES</div>' + pills(e.tech) + "</div>" +
          "</div>";
        return card + panel;
      }).join("");
      return '<section class="sec ruled" id="experience">' +
        '<div class="eyebrow reveal">EXPERIENCE</div>' +
        '<div class="exp-grid">' + cards + "</div></section>";
    }

    function workHTML(list) {
      if (!list || !list.length) return "";
      var cards = list.map(function (p) {
        var media = p.img
          ? '<img src="' + esc(p.img) + '" alt="' + esc(p.title) + '" loading="lazy">'
          : '<div class="shot"><span>' + esc(p.shot || "") + "</span></div>";
        var links = (p.links || []).map(function (l) { return extLink(l.url, l.label); }).join("");
        return '<div class="work-card">' + media +
          '<div class="work-body">' +
            "<h3>" + esc(p.title) + "</h3>" +
            "<p>" + esc(p.desc) + "</p>" +
            '<div class="problem">↳ ' + esc(p.problem) + "</div>" +
            '<div class="tags-sm">' + (p.tech || []).map(function (t) { return '<span class="pill">' + esc(t) + "</span>"; }).join("") + "</div>" +
            '<div class="work-links">' + links + "</div>" +
          "</div></div>";
      }).join("");
      return '<section class="sec ruled" id="work">' +
        '<div class="eyebrow reveal">SELECTED WORK</div>' +
        '<div class="work-grid">' + cards + "</div></section>";
    }

    function casesHTML(list) {
      if (!list || !list.length) return "";
      var items = list.map(function (c, i) {
        var num = String(i + 1).padStart(2, "0");
        var img = c.img ? '<img src="' + esc(c.img) + '" alt="' + esc(c.title) + '" loading="lazy">' : "";
        var link = (c.link && c.link !== "#") ? extLink(c.link, c.linkLabel || "Read full case study") : "";
        var tags = (c.tech || []).length
          ? '<div class="tags-sm" style="margin:0">' + c.tech.map(function (t) { return '<span class="pill">' + esc(t) + "</span>"; }).join("") + "</div>"
          : "<span></span>";
        return '<div class="case">' + img +
          '<div class="case-head"><span class="num">' + num + "</span><h3>" + esc(c.title) + "</h3></div>" +
          '<div class="case-cols">' +
            '<div><div class="label">CONTEXT &amp; PROBLEM</div><p>' + esc(c.problem) + "</p></div>" +
            '<div><div class="label">APPROACH</div><p>' + esc(c.approach) + "</p></div>" +
            '<div><div class="label">OUTCOME</div><p>' + esc(c.outcome) + "</p></div>" +
          "</div>" +
          '<div class="case-foot">' + tags + link + "</div>" +
        "</div>";
      }).join("");
      return '<section class="sec ruled" id="cases">' +
        '<div class="eyebrow gap reveal">CASE STUDIES</div>' +
        '<div class="cases">' + items + "</div></section>";
    }

    function researchHTML(r) {
      if (!r || !(r.pubs || []).length) return "";
      var pubs = r.pubs.map(function (p) {
        return '<div class="pub"><span class="venue">' + esc(p.venue) + "</span>" +
          '<div><div class="title">' + esc(p.title) + "</div>" +
          (p.authors ? '<div class="authors">' + esc(p.authors) + "</div>" : "") + "</div>" +
          (p.url ? extLink(p.url, "PDF") : "<span></span>") + "</div>";
      }).join("");
      return '<section class="sec ruled" id="research">' +
        '<div class="eyebrow reveal">RESEARCH</div>' +
        '<div class="two-col"><div>' +
          (r.title ? "<h2>" + esc(r.title) + "</h2>" : "") +
          (r.intro ? "<p>" + esc(r.intro) + "</p>" : "") +
          '<div class="label">INTERESTS</div>' + pills(r.interests) +
        "</div><div>" + pubs +
          (r.ongoing ? '<div class="ongoing">' + esc(r.ongoing) + "</div>" : "") +
        "</div></div></section>";
    }

    function skillsHTML(list) {
      if (!list || !list.length) return "";
      var rows = list.map(function (g) {
        var items = (g.items || []).map(function (s) {
          return "<span>" + esc(s) + "</span>";
        }).join('<span class="sep">·</span>');
        return '<div class="skill-row"><div class="group">' + esc(g.group) + "</div>" +
          '<div class="skill-items">' + items + "</div></div>";
      }).join("");
      return '<section class="sec ruled" id="skills">' +
        '<div class="eyebrow reveal">SKILLS</div>' +
        '<div class="skills-rows">' + rows + "</div></section>";
    }

    function eduHTML(edu, certs) {
      if (!(edu || []).length && !(certs || []).length) return "";
      var rows = (edu || []).map(function (e) {
        return '<div class="edu"><span class="per">' + esc(e.period) + "</span><div>" +
          '<div class="degree">' + esc(e.degree) + "</div>" +
          '<div class="school">' + esc(e.school) + "</div>" +
          (e.note ? '<div class="note">' + esc(e.note) + "</div>" : "") +
        "</div></div>";
      }).join("");
      var cs = (certs || []).map(function (c) {
        return '<div><span class="check">✓</span><span>' + esc(c) + "</span></div>";
      }).join("");
      return '<section class="sec ruled" id="education">' +
        '<div class="eyebrow reveal">EDUCATION &amp; CERTIFICATIONS</div>' +
        '<div class="two-col wide-left"><div>' + rows + "</div>" +
        (cs ? '<div><div class="label">CERTIFICATIONS &amp; CONTINUOUS LEARNING</div><div class="certs">' + cs + "</div></div>" : "<div></div>") +
        "</div></section>";
    }

    function beyondHTML(list) {
      if (!list || !list.length) return "";
      var cards = list.map(function (b) {
        var img = b.img ? '<img src="' + esc(b.img) + '" alt="' + esc(b.title) + '" loading="lazy">' : "";
        var glyph = b.img ? "" : '<div class="glyph">' + esc(b.tag || "") + "</div>";
        var link = b.link ? extLink(b.link, b.linkLabel || "Open") : "";
        return '<div class="beyond-card">' + img +
          '<div class="beyond-body">' + glyph +
            "<h3>" + esc(b.title) + "</h3>" +
            "<p>" + esc(b.desc) + "</p>" + link +
          "</div></div>";
      }).join("");
      return '<section class="sec ruled" id="beyond">' +
        '<div class="eyebrow gap reveal">BEYOND THE RESUME</div>' +
        '<div class="beyond-grid">' + cards + "</div></section>";
    }

    function contactHTML(s) {
      var btns = (s.social || []).map(function (l) { return extLink(l.url, l.label); }).join("");
      return '<section class="sec ruled contact" id="contact">' +
        '<div class="eyebrow">CONTACT</div>' +
        "<p>" + esc(s.contactIntro) + "</p>" +
        '<div class="contact-btns">' + btns + "</div></section>";
    }

    /* ---------- render ---------- */

    function render() {
      var s = data.site || {};
      document.title = s.name + " — QA, Data Quality & AI";
      document.getElementById("brand-name").textContent = s.name || "";
      document.getElementById("foot-left").textContent = "© " + new Date().getFullYear() + " " + (s.name || "");

      var nav = [];
      if ((data.work || []).length)       nav.push(["#work", "Work"]);
      if ((data.experience || []).length) nav.push(["#experience", "Experience"]);
      if (data.research && (data.research.pubs || []).length) nav.push(["#research", "Research"]);
      nav.push(["#about", "About"]);
      document.getElementById("nav-links").innerHTML = nav.map(function (n) {
        return '<a href="' + n[0] + '">' + n[1] + "</a>";
      }).join("");

      document.getElementById("app").innerHTML =
        heroHTML(s) +
        expHTML(data.experience) +
        workHTML(data.work) +
        casesHTML(data.cases) +
        researchHTML(data.research) +
        skillsHTML(data.skills) +
        eduHTML(data.education, data.certs) +
        beyondHTML(data.beyond) +
        contactHTML(s);

      Array.prototype.forEach.call(document.querySelectorAll("[data-exp]"), function (b) {
        b.onclick = function () {
          var id = b.getAttribute("data-exp");
          openExp = (openExp === id) ? null : id;
          render();
          var el = document.querySelector('[data-exp="' + id + '"]');
          if (el && openExp === id) el.focus({ preventScroll: true });
        };
      });

      placePanel();
    }

    /* The expanded panel spans the full grid width, so it can only start on a
       row of its own. Left directly after the clicked card it would split that
       card's row and push the remaining cards below it. Move it after the last
       card sharing the clicked card's row instead. Column count is responsive,
       so read it back from the resolved grid rather than assuming. */
    function placePanel() {
      var grid = document.querySelector(".exp-grid");
      if (!grid) return;
      var panel = grid.querySelector(".exp-panel");
      if (!panel) return;

      var cards = Array.prototype.slice.call(grid.querySelectorAll("[data-exp]"));
      var openCard = grid.querySelector('[data-exp="' + openExp + '"]');
      var i = cards.indexOf(openCard);
      if (i < 0) return;

      var cols = getComputedStyle(grid).gridTemplateColumns.split(" ").filter(Boolean).length || 1;
      var endOfRow = (Math.floor(i / cols) + 1) * cols;
      grid.insertBefore(panel, cards[endOfRow] || null);
    }

    var resizeTimer;
    window.addEventListener("resize", function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(placePanel, 120);
    });
  </script>
</body>
</html>
